Configure a service account in the apples project to meet the following 
requirements: 
● The name of the service account is ex280sa 
● The service account allows pods to be run as any available use 

Answer:
oc new-project apples
oc project
# Expected: Using project "apples" ✅
oc get all -n apples
# Expected: No resources found ✅
oc create serviceaccount ex280sa -n apples
oc get serviceaccount -n apples
# Detailed description
oc describe serviceaccount ex280sa -n apples
# ✅ CORRECT: -z requires service account NAME after it
oc adm policy add-scc-to-user anyuid \
  -z ex280sa \
  -n apples
# Method 1: Check who can use anyuid SCC

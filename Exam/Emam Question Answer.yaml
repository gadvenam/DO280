echo "=== SERVICE ACCOUNT ==="
oc get sa -n apples | grep ex280sa

echo "=== SCC BINDING ==="
oc adm policy who-can use scc/anyuid | grep ex280sa

echo "=== ROLE BINDING ==="
oc get rolebinding -n apples | grep anyuid

echo "=== FULL SA DESCRIPTION ==="

 1. Configure an identity provider 
Configure your OpenShift cluster to use an HTPasswd identity provider with 
the following requirements: 

● The name of the identity provider is ex280-htpasswd 
● The name of the secret is ex280-idp-secret 
● The user account armstrong is present and can log in with password 
indiaco 
●  The user account collins is present and can log in with password 
verastar 
● The user account aldrin is present and can log in with password moonhar 
● The user account jobs is present and can log in with password eastiver 
● The user account wozniak is present and can log in with password 
glimpse 
ANS:

# First user: use -c to CREATE the file (only once!)
htpasswd -c -B -b user.htpasswd armstrong indiaco

# Remaining users: NO -c flag (append to existing file)
htpasswd -B -b user.htpasswd collins verastar
htpasswd -B -b user.htpasswd aldrin moonhar
htpasswd -B -b user.htpasswd jobs eastiver
htpasswd -B -b user.htpasswd wozniak glimpse

cat user.htpasswd
# Count lines — must show 5
wc -l user.htpasswd
oc create secret generic ex280-idp-secret \
  --from-file=htpasswd=user.htpasswd \
  -n openshift-config
oc get secret ex280-idp-secret -n openshift-config
oc get oauth cluster -o yaml > oauth.yaml
cat oauth.yaml
vi oauth.yaml
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - name: ex280-htpasswd          # <-- exact name required
    mappingMethod: claim
    type: HTPasswd
    htpasswd:
      fileData:
        name: ex280-idp-secret    # <-- exact secret name required
oc apply -f oauth.yaml
# Watch pods restart (takes 1-3 minutes)
watch oc get pods -n openshift-authentication
oc get oauth cluster -o yaml
# ⚠️ Correct syntax: -u for username, -p for password

oc login -u armstrong -p indiaco
oc login -u collins -p verastar
oc login -u aldrin -p moonhar
oc login -u jobs -p eastiver
oc login -u wozniak -p glimpse
# Switch back to admin
oc login -u kubeadmin

# List all users
oc get users
# Also check identities
oc get identity


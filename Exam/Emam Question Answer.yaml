6.Configure and deploy a secure route Deploy an application called oxcart 
securely in the project called area51  
● The application has self-signed certificate available at 
"/C=US/ST=NC/L=Raleigh/O=RedHat/OU=RHT/CN=oxcart.apps.ocp4.example.com" Use 
newcert command to generate required tls objects, pass the subject as argument value 
● The application should be reachable at the following url 
https://oxcart.apps.ocp4.example.com  
● Application produces a valid Output

Answer:
# Create project
oc new-project area51
# Verify you are in correct project
oc project
# Expected: Using project "area51" ✅
# Deploy oxcart application
oc new-app --name oxcart \
  --image=nginx \
  -n area51
oc new-app --name oxcart \
  --image=bitnami/nginx \
  -n area51
watch oc get pods -n area51
oc get service -n area51

# Step 1: Generate private key (2048 bit)
openssl genrsa -out private.key 2048

# Step 2: Generate Certificate Signing Request (CSR)
openssl req -new \
  -key private.key \
  -out redhat.csr \
  -subj "/C=US/ST=NC/L=Raleigh/O=RedHat/OU=RHT/CN=oxcart.apps.ocp4.example.com"

# Step 3: Self-sign the certificate (valid 365 days)
openssl x509 -req \
  -in redhat.csr \
  -signkey private.key \
  -days 365 \
  -out redhat.crt
openssl x509 -in redhat.crt -text -noout | grep -E "Subject:|CN="
# Check all 3 files exist
ls -la private.key redhat.csr redhat.crt

# Verify certificate content
openssl x509 -in redhat.crt -noout -subject -dates
# Verify key matches certificate
openssl x509 -noout -modulus -in redhat.crt | md5sum
openssl rsa -noout -modulus -in private.key | md5sum
# Expected: BOTH md5sum values must be IDENTICAL ✅
oc create route edge \
  --service=oxcart \
  --key=private.key \
  --cert=redhat.crt \
  --hostname=oxcart.apps.ocp4.example.com \
  -n area51
oc get route -n area51
# Detailed route description
oc describe route oxcart -n area51
oc get all -n area51
# Test HTTPS access
curl -k https://oxcart.apps.ocp4.example.com
# Test with verbose to see TLS details
curl -kv https://oxcart.apps.ocp4.example.com 2>&1 | grep -E "subject|issuer|SSL|TLS|200"
# Check the certificate on the route
curl -kv https://oxcart.apps.ocp4.example.com 2>&1 | grep subject
# Check route has TLS configured
oc get route oxcart -n area51 -o yaml | grep -A5 tls:
# HTTP should either redirect or be blocked
curl -k https://oxcart.apps.ocp4.example.com

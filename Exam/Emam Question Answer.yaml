5.  Configure quotas 
Configure your OpenShift cluster to use quotas in the manhattan project with the 
following requirements: 
● The name of the quota is ex280-quota 
● The amount of memory consumed across all containers may not exceed 
15Gi 
● The total amount of CPU consumed across all containers may not exceed 
2 full cores 
● The maximum number of replication controllers does not exceed 3 
● The maximum number of pods does not exceed 3 
● The maximum number of services does not exceed 6 

Answer:
# Only run this if manhattan doesn't exist!
oc new-project Manhattan
oc project Manhattan
oc create quota ex280-quota \
  --hard=cpu=2,memory=15Gi,\
replicationcontrollers=3,pods=3,services=6 \
  -n Manhattan
cat << 'EOF' > quota.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ex280-quota
  namespace: manhattan
spec:
  hard:
    cpu: "2"
    memory: 15Gi
    replicationcontrollers: "3"
    pods: "3"
    services: "6"
EOF
oc apply -f quota.yaml
oc get quota -n Manhattan
oc describe quota ex280-quota -n Manhattan
oc get quota ex280-quota -n manhattan -o yaml

oc project manhattan

# Create a deployment with resource limits
oc create deployment test-quota \
  --image=nginx \
  -n Manhattan

oc set resources deployment test-quota \
  --requests=cpu=100m,memory=256Mi \
  -n Manhattan

oc describe quota ex280-quota -n Manhattan

# Try to scale beyond pod limit of 3
oc scale deployment test-quota --replicas=5 -n manhattan

# Check what happened
oc get pods -n manhattan
# Expected: Only 3 pods maximum created

oc describe quota ex280-quota -n manhattan
# Expected: pods Used = 3 (cannot exceed Hard = 3)

# Check quota blocks excessive memory requests
oc create deployment big-memory \
  --image=nginx \
  -n manhattan

oc set resources deployment big-memory \
  --requests=memory=20Gi \
  -n manhattan

# Check — should be blocked!
oc get events -n manhattan | grep -i quota
# Expected: exceeded quota message ✅
oc delete deployment test-quota -n manhattan
oc delete deployment big-memory -n manhattan

# Verify quota back to 0 used
oc describe quota ex280-quota -n Manhattan


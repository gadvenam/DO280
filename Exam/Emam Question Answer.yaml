13. Configure a network policy 
Configure a network policy using the database and checker projects with the 
following requirements: 
● The database project has a network policy with the name 
db-allow-mysql-conn based on pod selector label 
network.openshift.io/policy-group 
● Connections to the database project are restricted to deployments from the 

oc get rolebinding \
  system:openshift:scc:anyuid \
  -n apples \
  -o yaml
oc get sa ex280sa -n apples
# Check if ex280sa has anyuid SCC permission
oc adm policy who-can use scc/anyuid | grep ex280sa
cat << 'EOF' > test-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: test-anyuid
  namespace: apples
spec:
  serviceAccountName: ex280sa
  containers:
  - name: test
    image: nginx
    securityContext:
      runAsUser: 0
EOF
oc apply -f test-pod.yaml
# Wait for pod to be running
watch oc get pod test-anyuid -n apples
# Verify pod is running as root (user 0)
oc exec test-anyuid -n apples -- id
# Test pod WITHOUT service account (should fail or run as restricted)
cat << 'EOF' > test-pod-noSA.yaml
apiVersion: v1
kind: Pod
metadata:
  name: test-no-sa
  namespace: apples
spec:
  containers:
  - name: test
    image: nginx
    securityContext:
      runAsUser: 0
EOF
